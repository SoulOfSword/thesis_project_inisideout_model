[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jmfgas"
version = "0.1.0"
description = "Semi-analytical galaxy evolution models for the baryonic j-M-fgas relation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "jax",
    "jaxlib",
    "emcee",
    "pandas",
    "loky",
    "h5py",
    "pyyaml",
    "corner",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ipython",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
